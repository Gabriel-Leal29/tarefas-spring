spring.application.name=tarefas-spring
server.port=8080
spring.jackson.mapper.sort-properties-alphabetically=false

# Conexão com o MySQL. Os valores vêm de variáveis de ambiente (definidas no docker-compose.yml).
# O que está depois de ":" é o valor padrão, usado quando a variável não existe: assim dá para rodar
# a aplicação pelo IntelliJ apontando para o MySQL do compose, que fica exposto em localhost:3306.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tarefas}
spring.datasource.username=${DB_USER:tarefas}
spring.datasource.password=${DB_PASSWORD:tarefas}

# JPA/Hibernate
# update: cria as tabelas na primeira execução e ajusta o esquema quando as entidades mudam, sem apagar dados
spring.jpa.hibernate.ddl-auto=update
# Mostra o SQL gerado pelo Hibernate no log (útil para estudar; pode desligar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# A sessão do Hibernate fica restrita à camada de serviço (@Transactional), e não aberta durante toda a requisição
spring.jpa.open-in-view=false
