services:

  db:
    image: mysql:8.4
    container_name: tarefas-db
    environment:
      MYSQL_DATABASE: tarefas
      MYSQL_USER: tarefas
      MYSQL_PASSWORD: tarefas
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - dados-mysql:/var/lib/mysql
    networks:
      - rede-tarefas
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    image: tarefas-spring:latest
    container_name: tarefas-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tarefas
      DB_USER: tarefas
      DB_PASSWORD: tarefas
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - rede-tarefas
    restart: on-failure

volumes:
  dados-mysql:

networks:
  rede-tarefas:
    driver: bridge
